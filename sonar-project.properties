# Configuracion para el analisis automatico de SonarQube Cloud.
#
# Los scripts SQL de database/ repiten deliberadamente el patron idempotente
# (guard IF OBJECT_ID + definition por tabla); esa clonacion es propia del DDL
# y se excluye de la metrica de duplicacion para no penalizar el codigo nuevo.
sonar.duplication.exclusions=database/**/*.sql